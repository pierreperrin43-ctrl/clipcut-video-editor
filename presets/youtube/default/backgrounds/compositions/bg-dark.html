<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/>
<title>bg-dark</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;}
/* dark navy, a touch of depth toward center; lifted 2026-09-18 ("is our dark background normally this dark?") */
#base{position:absolute;inset:0;
  background:radial-gradient(ellipse 130% 100% at 50% 40%,
    #0d1a3a 0%, #081331 55%, #050b20 100%);}
/* 100px brand grid, very lightly visible (locked --line hue at reduced alpha) */
#grid{position:absolute;inset:0;
  background:
    repeating-linear-gradient(0deg, rgba(74,124,255,0.09) 0 2px, transparent 2px 100px),
    repeating-linear-gradient(90deg, rgba(74,124,255,0.09) 0 2px, transparent 2px 100px);}
/* vignette sits above the grid so the lines fade off toward the edges */
#vig{position:absolute;inset:0;
  background:radial-gradient(ellipse 105% 90% at 50% 50%,
    rgba(2,5,16,0) 52%, rgba(2,5,16,0.30) 80%, rgba(2,5,16,0.55) 100%);}
</style></head>
<body style="margin:0;background:#000;">
<div id="root" data-composition-id="main" data-width="1920" data-height="1080"
     data-start="0" data-duration="6.0000">
<div id="base"></div>
<div id="grid"></div>
<div id="vig"></div>
</div>
</body></html>
